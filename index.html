<body>
  <!-- Main Mobile Stage -->
  <div class="stage" id="stage">

    <!-- Clean Dark Festive Background Poster -->
    <img class="stage-bg-poster" src="images/bg.webp" alt="Background" />

    <div class="hero-gods-section">
      <div class="hero-video-container">
        <video class="hero-gods-video" id="hero-gods-video" autoplay loop muted playsinline>
          <source src="hero_gods_clean.mp4?v=2" type="video/mp4" />
        </video>
      </div>
    </div>

    <!-- Crisp 3D Title Banner Card (Elevated above scratch board to prevent trimming) -->
    <div class="hero-banner-card">
      <img class="hero-gods-bg-title" src="images/bg-title.webp" alt="កោសឈ្នះ! កោសឈ្នះ!" />
    </div>

    <!-- Drifting Gold Coins Animation Layer -->
    <div class="floating-coins-layer" id="floating-coins-layer"></div>

    <!-- Interactive Scratch Card Board with stage-img container -->
    <section class="scratch-board-wrapper" aria-label="Scratch Card Board">
      <img class="scratch-board-bg" src="images/stage-img3.webp" alt="Scratch Board Background" />
      <div class="scratch-grid" id="scratch-grid">
        <!-- 6 Interactive Canvas Scratch Cards populated dynamically by js/scratch.js -->
      </div>
    </section>

    <!-- Action Controls (Center Play Again Button - appears after scratching & popup) -->
    <div class="controls-row" id="controls-row">
      <button class="btn-play-again-stage" id="btn-auto-scratch" type="button" title="ចាប់ផ្តើមលេង">
        <img class="btn-play-again-img" src="images/try-again-bt.webp" alt="ចាប់ផ្តើមលេង" />
      </button>
    </div>

    <!-- Particle Shavings Container -->
    <div class="particles-container" id="particles-container"></div>

    <!-- Fullscreen Fireworks Celebration Canvas -->
    <canvas id="fireworks-canvas"></canvas>

    <!-- Modal: Individual Prize Win Celebration (100% Matching Reference Voucher Design) -->
    <div class="modal-overlay" id="modal-win-gift">
      <!-- Dynamic Volumetric God-Rays / X-Ray Canvas -->
      <canvas class="modal-xray-canvas" id="xray-canvas-win-gift"></canvas>

      <!-- Celebration Falling Money Snow Shower Canvas -->
      <canvas class="modal-congrats-canvas" id="congrats-canvas-win-gift"></canvas>

      <div class="popup-wrapper">
        <div class="modal-dialog popup-voucher-card">
          <!-- Celebration Floating Sparkle Stars (4-Point Golden Vector Sparkles) -->
          <svg class="modal-sparkle-star s1" viewBox="0 0 24 24" aria-hidden="true">
            <polygon points="12,1 15,9 23,12 15,15 12,23 9,15 1,12 9,9" fill="#ffea00" />
          </svg>
          <svg class="modal-sparkle-star s2" viewBox="0 0 24 24" aria-hidden="true">
            <polygon points="12,1 15,9 23,12 15,15 12,23 9,15 1,12 9,9" fill="#fff59d" />
          </svg>
          <svg class="modal-sparkle-star s3" viewBox="0 0 24 24" aria-hidden="true">
            <polygon points="12,1 15,9 23,12 15,15 12,23 9,15 1,12 9,9" fill="#ffe082" />
          </svg>
          <svg class="modal-sparkle-star s4" viewBox="0 0 24 24" aria-hidden="true">
            <polygon points="12,1 15,9 23,12 15,15 12,23 9,15 1,12 9,9" fill="#ffd54f" />
          </svg>

          <!-- Floating Close Button -->
          <button class="modal-close-btn" aria-label="Close">✕</button>

          <!-- Card Body Content -->
          <div class="popup-card-inner">
            <!-- Speech Bubble Pill Tag (Matching 10张3元立减券) -->
            <div class="popup-speech-bubble" id="win-gift-tag">
              <span id="win-gift-tag-text">សូមអបអរសាទរ</span>
              <div class="speech-arrow"></div>
            </div>

            <!-- Huge Hero Amount Display (Matching 30元) -->
            <div class="popup-hero-amount">
              <span class="amount-number" id="win-gift-amount-num">50</span>
              <span class="amount-currency">$</span>
            </div>

            <!-- Subtitle (Matching 购买后可得) -->
            <div class="popup-subtitle" id="win-gift-desc">ទទួលបានភ្លាមៗ</div>

            <!-- Big 3D Pill CTA Button -->
            <a class="popup-pill-cta" id="win-gift-cta" href="https://t.me/fafa558kh_bot?start=minigame" target="_blank"
              data-cta-action="Claim Prize">
              <span class="cta-label" id="win-gift-cta-label">ចុចទាមទាររង្វាន់</span>
              <div class="cta-shimmer"></div>
            </a>
          </div>
        </div>
      </div>
    </div>

  </div> <!-- End Mobile Stage (9:16) -->
