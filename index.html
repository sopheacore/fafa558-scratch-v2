  <link rel="preload" as="image" href="images/stamp_circle_pro.png">

<body>
  <!-- Main Mobile Stage (Background is strictly in container only) -->
  <div class="stage" id="stage">

    <!-- Clean Dark Festive Background Poster (No text, No icons) -->
    <img class="stage-bg-poster" src="images/bg.png" alt="Background" />

    <!-- Animated Hero Gods Section (Full released crop from authentic video) -->
    <div class="hero-gods-section">
      <video class="hero-gods-video" id="hero-gods-video" autoplay loop muted playsinline>
        <source src="hero_gods_clean.mp4" type="video/mp4" />
      </video>

      <!-- 5 Interactive Progress Badges Overlay directly atop the video banner -->
      <div class="gods-badges-overlay">
        <div class="god-badge-slot" id="god-badge-1" title="东路财神"></div>
        <div class="god-badge-slot" id="god-badge-2" title="南路财神"></div>
        <div class="god-badge-slot" id="god-badge-3" title="中路财神"></div>
        <div class="god-badge-slot" id="god-badge-4" title="西路财神"></div>
        <div class="god-badge-slot" id="god-badge-5" title="北路财神"></div>
      </div>
    </div>

    <!-- Interactive Scratch Card Board with stage-img container -->
    <section class="scratch-board-wrapper" aria-label="Scratch Card Board">
      <img class="scratch-board-bg" src="images/stage-img.png" alt="Scratch Board Background" />
      <div class="scratch-grid" id="scratch-grid">
        <!-- 6 Interactive Canvas Scratch Cards populated dynamically by js/scratch.js -->
      </div>
    </section>

    <!-- Action Controls (Center Scratch Button) -->
    <div class="controls-row">
      <div class="btn-pill btn-scratch-center" id="btn-auto-scratch" title="点我刮开" role="button">
        <img src="images/clean_btn_scratch.png" alt="点我刮开" />
        <div class="shimmer-sweep"></div>
      </div>
    </div>

    <!-- Particle Shavings Container -->
    <div class="particles-container" id="particles-container"></div>

    <!-- Fullscreen Fireworks Celebration Canvas -->
    <canvas id="fireworks-canvas"></canvas>
  </div>

  <!-- Modal 1: Grand Victory Celebration (888 Cash / 5 Gods of Wealth Complete) -->
  <div class="modal-overlay" id="modal-grand-win">
    <div class="modal-dialog">
      <button class="modal-close-btn" aria-label="Close">✕</button>
      <div class="modal-header-tag">🎊 恭喜大吉大利 🎊</div>
      <h2 class="modal-title">集齐五路财神！</h2>
      <p class="modal-desc">鸿运当头，恭喜您斩获现金大奖！</p>
      
      <div class="modal-prize-showcase">
        <img class="modal-prize-icon" src="images/ticket_grand_888_pro.png" alt="现金大奖" />
        <div class="modal-prize-amount">888 元现金</div>
      </div>

      <a class="modal-cta-btn" href="#" data-cta-action="Grand Prize 888 Claim">
        🔥 立即领取 888元 现金
      </a>
    </div>
  </div>

  <!-- Modal 2: My Prizes (我的奖品) -->
  <div class="modal-overlay" id="modal-my-prizes">
    <div class="modal-dialog">
      <button class="modal-close-btn" aria-label="Close">✕</button>
      <div class="modal-header-tag">🏆 奖品背包</div>
      <h2 class="modal-title">我的中奖记录</h2>
      <p class="modal-desc">已刮出的所有超值奖励</p>

      <div class="prizes-list-container" id="prizes-list-content">
        <!-- Filled dynamically -->
      </div>

      <a class="modal-cta-btn" href="#" data-cta-action="Redeem All Prizes">
        ⚡ 立即前往兑换
      </a>
    </div>
  </div>

  <!-- Modal 3: Mid-Year Welfare Pack (年中福利包) -->
  <div class="modal-overlay" id="modal-welfare">
    <div class="modal-dialog">
      <button class="modal-close-btn" aria-label="Close">✕</button>
      <div class="modal-header-tag">🎁 年中专属特权</div>
      <h2 class="modal-title">FAFA558 福利包</h2>
      <p class="modal-desc">限时开户即送，豪礼领不停！</p>

      <div class="modal-prize-showcase">
        <img class="modal-prize-icon" src="images/ticket_redpacket_pro.png" alt="福利红包" />
        <div class="modal-prize-amount">188 次免费转 + 100% 存送</div>
      </div>

      <a class="modal-cta-btn" href="#" data-cta-action="Claim Welfare Pack">
        🎉 立即抢领福利
      </a>
    </div>
  </div>

  <script src="js/scratch.js"></script>
</body>
</html>
